[package]
name = "drift-engine"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1"
axum = "0.8"
axum-server = { version = "0.9", default-features = false, features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider", "webpki-roots"] }
rcgen = "0.14"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
blake3 = "1"
libc = "0.2"
hmac = "0.13"
hex = "0.4"
rand = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
redb = "4"
mdns-sd = "0.21"
if-addrs = "0.15"
tower-http = { version = "0.7", features = ["fs", "set-header"] }
tower = { version = "0.5", features = ["limit", "util"] }
base64 = "0.23"

[dev-dependencies]
tempfile = "3"
