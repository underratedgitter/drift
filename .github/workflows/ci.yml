name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: '24', cache: npm}
      - run: rustup update stable && rustup component add rustfmt clippy
      - name: Linux webview libraries
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - run: npx tsc --noEmit && npm run lint
      - run: npm run build
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
  app:
    name: App (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: macOS arm64, runner: macos-15}
          - {name: macOS x64, runner: macos-15-intel}
          - {name: Windows x64, runner: windows-2025}
          - {name: Linux x64, runner: ubuntu-24.04}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: '24', cache: npm}
      - run: rustup update stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - name: Build unsigned installers (development only, never published)
        run: npx tauri build --debug
      - uses: actions/upload-artifact@v5
        with:
          name: drift-${{ matrix.runner }}
          path: |
            target/debug/bundle/**/*.dmg
            target/debug/bundle/**/*.exe
            target/debug/bundle/**/*.msi
            target/debug/bundle/**/*.deb
            target/debug/bundle/**/*.AppImage
          retention-days: 7
          if-no-files-found: warn
