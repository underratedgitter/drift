[package]
name = "drift-app"
version = "0.3.0"
description = "Drift: send files directly between your Macs"
edition = "2024"
license = "MIT"
publish = false

[lib]
name = "drift_app_lib"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
drift-engine = { path = "../engine" }
anyhow = "1"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-deep-link = "2.6"
tauri-plugin-dialog = "2.8"
tauri-plugin-notification = "2.7"
tauri-plugin-opener = "2.7"
tokio = { version = "1", features = ["sync", "time"] }
tauri-plugin-single-instance = { version = "2.5", features = ["deep-link"] }
tower = { version = "0.5", features = ["util"] }

[dev-dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png", "test"] }
tempfile = "3"
