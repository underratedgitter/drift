[package]
name = "drift-app"
version = "0.3.0"
description = "Drift: files between your own devices, directly over your network"
edition = "2024"
license = "MIT"
publish = false

[lib]
name = "drift_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
drift-engine = { path = "../engine" }
anyhow = "1"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-deep-link = "2.6"
tauri-plugin-dialog = "2.8"
tauri-plugin-notification = "2.7"
tauri-plugin-opener = "2.7"
tokio = { version = "1", features = ["sync", "time"] }
tower = { version = "0.5", features = ["util"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = { version = "2.5", features = ["deep-link"] }
