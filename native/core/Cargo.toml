[package]
name = "drift-native"
version = "0.2.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
drift-engine = { path = "../../engine" }
anyhow = "1"
serde_json = "1"
tokio = { version = "1", features = ["full"] }
include_dir = "0.7"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots-no-provider"] }
tempfile = "3"

[profile.release]
lto = true
strip = true
